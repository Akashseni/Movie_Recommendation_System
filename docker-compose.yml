version: "3.9"

services:
  backend:
    build:
      context: ./backend
    image: ${DOCKERHUB_USER:-local}/movie-recsys-backend:${IMAGE_TAG:-latest}
    container_name: movie-recsys-backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    image: ${DOCKERHUB_USER:-local}/movie-recsys-frontend:${IMAGE_TAG:-latest}
    container_name: movie-recsys-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
